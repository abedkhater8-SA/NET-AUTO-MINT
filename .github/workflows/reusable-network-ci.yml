name: Reusable Network CI

on:
  workflow_call:
    inputs:
      python-version:
        description: "Python version"
        required: false
        type: string
        default: "3.12"

    secrets:
      DEVICE_USERNAME:
        required: true

      DEVICE_PASSWORD:
        required: true

      DEVICE_SECRET:
        required: true

    outputs:
      ci-status:
        description: "Final CI result"
        value: ${{ jobs.network-ci.outputs.status }}

jobs:
  network-ci:
    runs-on: self-hosted

    outputs:
      status: ${{ steps.result.outputs.status }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt

      - name: Run Ruff
        run: |
          ruff check .

      - name: Run Network Tests
        env:
          DEVICE_USERNAME: ${{ secrets.DEVICE_USERNAME }}
          DEVICE_PASSWORD: ${{ secrets.DEVICE_PASSWORD }}
          DEVICE_SECRET: ${{ secrets.DEVICE_SECRET }}
        run: |
          python -m pytest -v

      - name: Set Result
        id: result
        if: ${{ success() }}
        run: |
          echo "status=passed" >> "$GITHUB_OUTPUT"